<svg xmlns="http://www.w3.org/2000/svg" width="69mm" height="94mm" viewBox="0 0 69 94" role="img" aria-label="Delivery &amp; enforcement print playtest card"><rect width="69" height="94" fill="#E7DCC5"/><rect x="3" y="3" width="63" height="88" rx="2" fill="none" stroke="#A07D3C" stroke-width=".3"/><rect x="8" y="8" width="53" height="78" fill="none" stroke="#777" stroke-dasharray="1 1" stroke-width=".15"/><text x="9" y="12" fill="#A07D3C" font-size="2.2" font-family="Arial,sans-serif"><tspan x="9" dy="0">INVESTIGATION</tspan></text><text x="9" y="21" fill="#11171B" font-size="4" font-family="Arial,sans-serif"><tspan x="9" dy="0">Delivery &amp; enforcement</tspan></text><g transform="translate(25 32) scale(0.75)"><path d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14m5 12 6 6" fill="none" stroke="#5C674D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></g><text x="9" y="56" fill="#A07D3C" font-size="2.1" font-family="Arial,sans-serif"><tspan x="9" dy="0">Enforcement phase</tspan></text><text x="9" y="63" fill="#11171B" font-size="2.4" font-family="Arial,sans-serif"><tspan x="9" dy="0">For each investigated house, roll</tspan><tspan x="9" dy="3.5999999999999996">d6. If roll is at most</tspan><tspan x="9" dy="3.5999999999999996">investigation: confiscate one</tspan><tspan x="9" dy="3.5999999999999996">unreserved cargo (medical, then</tspan><tspan x="9" dy="3.5999999999999996">communications, then vehicles);</tspan><tspan x="9" dy="3.5999999999999996">fine 2; lose 1 reputation.</tspan></text><text x="9" y="84" fill="#11171B" font-size="1.7" font-family="Arial,sans-serif"><tspan x="9" dy="0">investigation-reference</tspan></text><path d="M0 3h2M3 0v2M67 3h2M66 0v2M0 91h2M3 92v2M67 91h2M66 92v2" stroke="#000" stroke-width=".15"/></svg>