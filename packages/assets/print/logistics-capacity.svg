<svg xmlns="http://www.w3.org/2000/svg" width="69mm" height="94mm" viewBox="0 0 69 94" role="img" aria-label="Logistics capacity print playtest card"><rect width="69" height="94" fill="#E7DCC5"/><rect x="3" y="3" width="63" height="88" rx="2" fill="none" stroke="#A07D3C" stroke-width=".3"/><rect x="8" y="8" width="53" height="78" fill="none" stroke="#777" stroke-dasharray="1 1" stroke-width=".15"/><text x="9" y="12" fill="#A07D3C" font-size="2.2" font-family="Arial,sans-serif"><tspan x="9" dy="0">LOGISTICS</tspan></text><text x="9" y="21" fill="#11171B" font-size="4" font-family="Arial,sans-serif"><tspan x="9" dy="0">Logistics capacity</tspan></text><g transform="translate(25 32) scale(0.75)"><path d="M4 4h6v6H4V4m10 10h6v6h-6v-6M7 13v4h4m6-6V7h-4" fill="none" stroke="#5C674D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></g><text x="9" y="56" fill="#A07D3C" font-size="2.1" font-family="Arial,sans-serif"><tspan x="9" dy="0">Network / reserve</tspan></text><text x="9" y="63" fill="#11171B" font-size="2.4" font-family="Arial,sans-serif"><tspan x="9" dy="0">One reusable logistics capacity.</tspan><tspan x="9" dy="3.5999999999999996">Cap 3 per house. Reserve for</tspan><tspan x="9" dy="3.5999999999999996">committed bids until delivery or</tspan><tspan x="9" dy="3.5999999999999996">failure. Upkeep is 1 for total</tspan><tspan x="9" dy="3.5999999999999996">capacity above 1.</tspan></text><text x="9" y="84" fill="#11171B" font-size="1.7" font-family="Arial,sans-serif"><tspan x="9" dy="0">logistics-capacity</tspan></text><path d="M0 3h2M3 0v2M67 3h2M66 0v2M0 91h2M3 92v2M67 91h2M66 92v2" stroke="#000" stroke-width=".15"/></svg>